<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GarryLee 网站工作台</title>
  <link rel="stylesheet" href="/workbench/workbench.css">
  <script src="/workbench/workbench.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">G</span>
      <div><strong>网站工作台</strong><span>GarryLee Personal Web</span></div>
    </div>
    <div class="topbar-actions">
      <span class="save-state" id="save-state">正在读取...</span>
      <button class="button" id="save-button" type="button">保存并预览</button>
      <button class="button button-primary" id="publish-button" type="button">发布到 GitHub</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor-pane" aria-label="网站内容编辑">
      <div class="editor-heading">
        <div>
          <p class="eyebrow">CONTENT</p>
          <h1>网站内容</h1>
        </div>
        <div class="editor-links"><a href="/" target="_blank">学术主页 ↗</a><a href="/work.html" target="_blank">工作站 ↗</a></div>
      </div>

      <form id="content-form">
        <fieldset>
          <legend>基本信息</legend>
          <div class="field-grid two-columns">
            <label>显示姓名<input id="profile-name" type="text" required></label>
            <label>标识字母（可选）<input id="profile-mark" type="text" maxlength="2"></label>
          </div>
          <label>专业标签<input id="profile-eyebrow" type="text" required></label>
          <label>专业标签（英文）<input id="profile-eyebrow-en" type="text" required></label>
          <label>首页主标题<textarea id="profile-headline" rows="2" required></textarea></label>
          <label>首页主标题（英文）<textarea id="profile-headline-en" rows="2" required></textarea></label>
          <label>个人简介<textarea id="profile-introduction" rows="4" required></textarea></label>
          <label>个人简介（英文）<textarea id="profile-introduction-en" rows="4" required></textarea></label>
          <div class="field-grid two-columns">
            <label>浏览器标题<input id="meta-title" type="text" required></label>
            <label>主题强调色<input id="meta-accent" type="color" required></label>
          </div>
          <label>浏览器标题（英文）<input id="meta-title-en" type="text" required></label>
          <label>搜索摘要<textarea id="meta-description" rows="3" required></textarea></label>
          <label>搜索摘要（英文）<textarea id="meta-description-en" rows="3" required></textarea></label>
        </fieldset>

        <fieldset>
          <legend>侧边栏内容</legend>
          <div class="field-grid two-columns">
            <label>学校名称<input id="sidebar-affiliation" type="text"></label>
            <label>学校名称（英文）<input id="sidebar-affiliation-en" type="text"></label>
            <label>KMAX 文案<input id="sidebar-lab" type="text"></label>
            <label>KMAX 文案（英文）<input id="sidebar-lab-en" type="text"></label>
            <label>方向标签<input id="sidebar-field-label" type="text"></label>
            <label>方向标签（英文）<input id="sidebar-field-label-en" type="text"></label>
            <label>地点标签<input id="sidebar-location-label" type="text"></label>
            <label>地点标签（英文）<input id="sidebar-location-label-en" type="text"></label>
            <label>地点<input id="sidebar-location" type="text"></label>
            <label>地点（英文）<input id="sidebar-location-en" type="text"></label>
            <label>教育经历标题<input id="sidebar-education-label" type="text"></label>
            <label>教育经历标题（英文）<input id="sidebar-education-label-en" type="text"></label>
          </div>
          <div class="field-grid two-columns">
            <label>合作页身份<input id="sidebar-work-role" type="text"></label>
            <label>合作页身份（英文）<input id="sidebar-work-role-en" type="text"></label>
            <label>合作页副标题<input id="sidebar-work-affiliation" type="text"></label>
            <label>合作页副标题（英文）<input id="sidebar-work-affiliation-en" type="text"></label>
            <label>可合作状态<input id="sidebar-availability" type="text"></label>
            <label>可合作状态（英文）<input id="sidebar-availability-en" type="text"></label>
            <label>沟通语言标签<input id="sidebar-response-label" type="text"></label>
            <label>沟通语言标签（英文）<input id="sidebar-response-label-en" type="text"></label>
            <label>沟通语言内容<input id="sidebar-response-value" type="text"></label>
            <label>沟通语言内容（英文）<input id="sidebar-response-value-en" type="text"></label>
            <label>工作方式标签<input id="sidebar-delivery-label" type="text"></label>
            <label>工作方式标签（英文）<input id="sidebar-delivery-label-en" type="text"></label>
            <label>工作方式内容<input id="sidebar-delivery-value" type="text"></label>
            <label>工作方式内容（英文）<input id="sidebar-delivery-value-en" type="text"></label>
          </div>
          <div class="field-grid two-columns">
            <label>GitHub 链接文字<input id="sidebar-github-label" type="text"></label>
            <label>GitHub 链接文字（英文）<input id="sidebar-github-label-en" type="text"></label>
            <label>ResearchGate 链接文字<input id="sidebar-researchgate-label" type="text"></label>
            <label>ResearchGate 链接文字（英文）<input id="sidebar-researchgate-label-en" type="text"></label>
            <label>服务入口文字<input id="sidebar-services-label" type="text"></label>
            <label>服务入口文字（英文）<input id="sidebar-services-label-en" type="text"></label>
            <label>返回研究文字<input id="sidebar-back-label" type="text"></label>
            <label>返回研究文字（英文）<input id="sidebar-back-label-en" type="text"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>页面文字</legend>
          <label>中文界面文字 <span>格式：key=文字，每行一项；可修改等号后的内容</span><textarea id="ui-copy-zh" rows="16"></textarea></label>
          <label>英文界面文字 <span>格式：key=text，每行一项；可修改等号后的内容</span><textarea id="ui-copy-en" rows="16"></textarea></label>
        </fieldset>

        <fieldset>
          <legend>图标与图片</legend>
          <div class="field-grid two-columns">
            <label>邮箱图标<input id="icon-email" type="text"></label>
            <label>GitHub 图标<input id="icon-github" type="text"></label>
            <label>ResearchGate 图标<input id="icon-researchgate" type="text"></label>
            <label>服务入口图标<input id="icon-services" type="text"></label>
            <label>返回研究图标<input id="icon-back" type="text"></label>
            <label>按钮箭头图标<input id="icon-arrow" type="text"></label>
            <label>外链箭头图标<input id="icon-external" type="text"></label>
            <label>教育徽标图片地址<input id="icon-education-emblem" type="text"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>动态视觉</legend>
          <label class="check-row"><input id="visual-motion" type="checkbox"><span><strong>启用等离子体流场</strong><small>关闭后显示静态科学纹理，并遵循系统的“减少动态效果”设置。</small></span></label>
          <div class="field-grid two-columns">
            <label>粒子密度 <output id="density-output">180</output><input id="visual-density" type="range" min="60" max="320" step="10"></label>
            <label>流动速度 <output id="speed-output">0.85</output><input id="visual-speed" type="range" min="0.25" max="1.5" step="0.05"></label>
          </div>
          <div class="field-grid two-columns">
            <label>主流颜色<input id="visual-primary" type="color"></label>
            <label>次流颜色<input id="visual-secondary" type="color"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>关注方向与能力</legend>
          <label>当前关注 <span>每行一项</span><textarea id="focus-list" rows="5"></textarea></label>
          <label>当前关注（英文）<span>与中文逐行对应</span><textarea id="focus-list-en" rows="5"></textarea></label>
          <label>方向说明 <span>每行一项，与“当前关注”逐行对应</span><textarea id="focus-details" rows="6"></textarea></label>
          <label>方向说明（英文）<span>与中文逐行对应</span><textarea id="focus-details-en" rows="6"></textarea></label>
          <label>学术概览 <span>格式：时间｜学校｜学位｜说明，每行一项</span><textarea id="credential-list" rows="5"></textarea></label>
          <label>学术概览（英文）<span>格式：Period｜Institution｜Degree｜Details，每行一项</span><textarea id="credential-list-en" rows="5"></textarea></label>
          <label>页面提示（可选）<span>留空后隐藏主页学术概览下方的 NOTE 提示</span><textarea id="note-copy" rows="3"></textarea></label>
          <label>页面提示（英文，可选）<span>留空后隐藏英文页面中的 NOTE 提示</span><textarea id="note-copy-en" rows="3"></textarea></label>
        </fieldset>

        <fieldset>
          <div class="fieldset-heading">
            <legend>代表项目（可选）</legend>
            <button class="button button-small" id="add-project" type="button">添加项目</button>
          </div>
          <div class="repeater" id="project-editor" data-empty-label="暂无项目，可直接保存"></div>
        </fieldset>

        <fieldset>
          <div class="fieldset-heading">
            <legend>合作服务（可选）</legend>
            <button class="button button-small" id="add-service" type="button">添加服务</button>
          </div>
          <div class="repeater" id="service-editor" data-empty-label="暂无服务，可直接保存"></div>
        </fieldset>

        <fieldset>
          <legend>联系方式</legend>
          <div class="field-grid two-columns">
            <label>邮箱<input id="contact-email" type="email" required></label>
            <label>微信（可选）<input id="contact-wechat" type="text"></label>
          </div>
          <label>GitHub 主页<input id="contact-github" type="url" required></label>
          <label>ResearchGate 主页（可选）<input id="contact-researchgate" type="url"></label>
          <label>页脚文字<input id="footer-text" type="text"></label>
          <label>页脚文字（英文）<input id="footer-text-en" type="text"></label>
        </fieldset>
      </form>
    </section>

    <section class="preview-pane" aria-label="网站实时预览">
      <div class="preview-toolbar">
        <div>
          <span class="preview-dot"></span>
          <span id="preview-label">桌面预览</span>
        </div>
        <div class="segmented" aria-label="预览尺寸">
          <button class="is-active" type="button" data-preview="desktop">桌面</button>
          <button type="button" data-preview="mobile">手机</button>
        </div>
      </div>
      <div class="preview-stage" id="preview-stage">
        <iframe id="site-preview" title="个人主页预览" src="/"></iframe>
      </div>
    </section>
  </main>

  <dialog id="publish-dialog">
    <form method="dialog" id="publish-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">PUBLISH</p><h2>发布到 GitHub</h2></div>
        <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
      </div>
      <p>工作台会先保存当前内容，然后提交并推送到 <code>Jair0824/Jair0824.github.io</code>。GitHub Pages 将自动部署公开网站。</p>
      <label>提交说明<input id="commit-message" type="text" value="Update personal website" required></label>
      <div class="dialog-actions">
        <button class="button" value="cancel" type="submit">取消</button>
        <button class="button button-primary" id="confirm-publish" value="default" type="button">确认发布</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="service-template">
    <article class="repeat-item service-item">
      <div class="repeat-heading"><strong>服务</strong><button class="text-button remove-item" type="button">删除</button></div>
      <label>标题<input data-field="title" type="text" required></label>
      <label>标题（英文）<input data-field="titleEn" type="text"></label>
      <label>说明<textarea data-field="description" rows="3" required></textarea></label>
      <label>说明（英文）<textarea data-field="descriptionEn" rows="3"></textarea></label>
    </article>
  </template>

  <template id="project-template">
    <article class="repeat-item project-item">
      <div class="repeat-heading"><strong>项目</strong><button class="text-button remove-item" type="button">删除</button></div>
      <label>项目名称<input data-field="title" type="text" required></label>
      <label>项目名称（英文）<input data-field="titleEn" type="text"></label>
      <label>状态标签<input data-field="status" type="text"></label>
      <label>状态标签（英文）<input data-field="statusEn" type="text"></label>
      <label>项目说明<textarea data-field="summary" rows="4" required></textarea></label>
      <label>项目说明（英文）<textarea data-field="summaryEn" rows="4"></textarea></label>
      <div class="field-grid two-columns">
        <label>项目网址<input data-field="url" type="url" required></label>
        <label>链接文字<input data-field="linkLabel" type="text"></label>
      </div>
      <label>链接文字（英文）<input data-field="linkLabelEn" type="text"></label>
      <label>能力标签 <span>使用逗号分隔</span><input data-field="tags" type="text"></label>
      <label>能力标签（英文）<span>使用逗号分隔</span><input data-field="tagsEn" type="text"></label>
      <div class="field-grid two-columns">
        <label>视觉品牌<input data-field="visualLabel" type="text"></label>
        <label>视觉导航<input data-field="visualMeta" type="text"></label>
      </div>
      <div class="field-grid two-columns">
        <label>视觉品牌（英文）<input data-field="visualLabelEn" type="text"></label>
        <label>视觉导航（英文）<input data-field="visualMetaEn" type="text"></label>
      </div>
      <label>视觉标题<input data-field="visualTitle" type="text"></label>
      <label>视觉标题（英文）<input data-field="visualTitleEn" type="text"></label>
    </article>
  </template>
</body>
</html>
